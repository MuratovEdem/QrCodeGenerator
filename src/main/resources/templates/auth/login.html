<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control-M — Вход в систему</title>

    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>

    <!-- Шрифты Control-M -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" th:href="@{/images/logo.png}">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">

    <style>
        :root {
            --primary-dark: #1E2A38;
            --accent: #FF0000;
            --bg: #F8FAFC;
            --card: #FFFFFF;
            --text-main: #1A1A1A;
            --text-secondary: #64748B;
            --border: #E2E8F0;
            --border-light: #F1F5F9;
            --radius: 10px;
            --shadow: 0 1px 3px rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.05);
            --transition: all 0.2s ease;
            --success: #10B981;
            --danger: #EF4444;
            --warning: #F59E0B;
            --info: #3B82F6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #1E2A38 0%, #2A3A4A 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 400px;
        }

        /* КАРТОЧКА ВХОДА */
        .login-card {
            background: var(--card);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border);
        }

        /* ШАПКА КАРТОЧКИ */
        .login-header {
            background: var(--primary-dark);
            padding: 30px 30px 20px;
            text-align: center;
            position: relative;
        }

        .login-header::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 3px;
            background: var(--accent);
            border-radius: 2px;
        }

        .login-header p {
            color: #CBD5E1;
            font-size: 14px;
            margin: 20px 0 0;
        }

        .logo-block {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            margin-bottom: 8px;
        }

        .logo-block img {
            height: 45px;
            width: auto;
            display: block;
        }

        .logo-text {
            display: flex;
            flex-direction: column;
        }

        .logo-title {
            font-family: 'Manrope', sans-serif;
            font-size: 22px;
            font-weight: 600;
            letter-spacing: 0.5px;
            color: white;
            line-height: 1.2;
        }

        .logo-icon img {
            width: 45px;
            height: 45px;
            object-fit: contain;
            display: block;
        }

        .login-header h2 {
            color: white;
            font-family: 'Manrope', sans-serif;
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        .login-header p {
            color: #CBD5E1;
            font-size: 14px;
            margin: 0;
        }

        /* ТЕЛО КАРТОЧКИ */
        .login-body {
            padding: 30px;
        }

        /* АЛЕРТЫ */
        .alert {
            padding: 16px 20px;
            border-radius: 8px;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 12px;
            border: none;
            border-left: 4px solid;
            background: var(--card);
            box-shadow: var(--shadow);
            font-size: 13px;
        }

        .alert-danger {
            border-left-color: var(--danger);
            background: #FEF2F2;
            color: #991B1B;
        }

        .alert-success {
            border-left-color: var(--success);
            background: #F0FDF4;
            color: #166534;
        }

        .alert i {
            font-size: 16px;
        }

        .btn-close {
            margin-left: auto;
            background: none;
            border: none;
            font-size: 18px;
            cursor: pointer;
            color: var(--text-secondary);
            opacity: 0.7;
            transition: var(--transition);
        }

        .btn-close:hover {
            opacity: 1;
        }

        /* ПОЛЯ ФОРМЫ */
        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            font-size: 12px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.3px;
            margin-bottom: 8px;
        }

        .form-label i {
            color: var(--accent);
            font-size: 14px;
        }

        .input-group {
            display: flex;
            align-items: center;
            border: 1px solid var(--border);
            border-radius: 8px;
            transition: var(--transition);
            background: white;
        }

        .input-group:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(255, 0, 0, 0.1);
        }

        .input-group-text {
            padding: 12px 16px;
            background: var(--border-light);
            border-right: 1px solid var(--border);
            border-radius: 8px 0 0 8px;
            color: var(--text-secondary);
            font-size: 14px;
        }

        .form-control {
            flex: 1;
            padding: 12px 16px;
            border: none;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            background: transparent;
            border-radius: 0 8px 8px 0;
        }

        .form-control:focus {
            outline: none;
        }

        .btn-toggle-password {
            padding: 12px 16px;
            background: transparent;
            border: none;
            border-left: 1px solid var(--border);
            color: var(--text-secondary);
            cursor: pointer;
            transition: var(--transition);
            font-size: 16px;
        }

        .btn-toggle-password:hover {
            color: var(--accent);
        }

        /* ЧЕКБОКС */
        .form-check {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 24px;
        }

        .form-check-input {
            width: 18px;
            height: 18px;
            border: 1px solid var(--border);
            border-radius: 4px;
            cursor: pointer;
            accent-color: var(--primary-dark);
        }

        .form-check-label {
            color: var(--text-secondary);
            font-size: 13px;
            cursor: pointer;
        }

        /* КНОПКА ВХОДА */
        .btn-login {
            width: 100%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 14px 24px;
            background: var(--primary-dark);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
        }

        .btn-login:hover {
            background: #2A3A4A;
            transform: translateY(-1px);
            box-shadow: var(--shadow-md);
        }

        .btn-login i {
            font-size: 16px;
        }

        /* ПОДВАЛ */
        .login-footer {
            padding: 20px 30px;
            text-align: center;
            border-top: 1px solid var(--border-light);
            color: var(--text-secondary);
            font-size: 12px;
        }

        .login-footer a {
            color: var(--primary-dark);
            text-decoration: none;
            font-weight: 500;
            transition: var(--transition);
        }

        .login-footer a:hover {
            color: var(--accent);
        }
    </style>
</head>
<body>
<div class="login-container">
    <div class="login-card">

        <!-- ШАПКА -->
        <div class="login-header">
            <div class="logo-block">
                <img th:src="@{/images/logo.png}"
                     src="https://via.placeholder.com/45x45/1E2A38/FFFFFF?text=CM"
                     alt="Логотип Control-M">
                <div class="logo-text">
                    <div class="logo-title">CONTROL-M</div>
                </div>
            </div>
            <p>Вход в систему управления клиентами</p>
        </div>

        <!-- ТЕЛО -->
        <div class="login-body">

            <!-- Сообщения об ошибках -->
            <div th:if="${param.error}" class="alert alert-danger">
                <i class="bi bi-exclamation-triangle-fill"></i>
                <span th:text="${error != null ? error : 'Неверное имя пользователя или пароль'}"></span>
                <button type="button" class="btn-close" onclick="this.parentElement.style.display='none'">×</button>
            </div>

            <!-- Сообщение о выходе -->
            <div th:if="${param.logout}" class="alert alert-success">
                <i class="bi bi-check-circle-fill"></i>
                <span th:text="${message != null ? message : 'Вы успешно вышли из системы'}"></span>
                <button type="button" class="btn-close" onclick="this.parentElement.style.display='none'">×</button>
            </div>

            <!-- Сообщение о регистрации -->
            <div th:if="${param.registered}" class="alert alert-success">
                <i class="bi bi-check-circle-fill"></i>
                <span>Регистрация успешна! Теперь вы можете войти в систему.</span>
                <button type="button" class="btn-close" onclick="this.parentElement.style.display='none'">×</button>
            </div>

            <!-- Форма входа -->
            <form th:action="@{/auth/login}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                <!-- Поле: Имя пользователя -->
                <div class="form-group">
                    <label for="username" class="form-label">
                        <i class="bi bi-person"></i>
                        Имя пользователя
                    </label>
                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="bi bi-person"></i>
                        </span>
                        <input type="text"
                               class="form-control"
                               id="username"
                               name="username"
                               placeholder="Введите имя пользователя"
                               required
                               autofocus>
                    </div>
                </div>

                <!-- Поле: Пароль -->
                <div class="form-group">
                    <label for="password" class="form-label">
                        <i class="bi bi-lock"></i>
                        Пароль
                    </label>
                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="bi bi-lock"></i>
                        </span>
                        <input type="password"
                               class="form-control"
                               id="password"
                               name="password"
                               placeholder="Введите пароль"
                               required>
                        <button type="button" class="btn-toggle-password" id="togglePassword">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                </div>

                <!-- Чекбокс "Запомнить меня" -->
                <div class="form-check">
                    <input type="checkbox"
                           class="form-check-input"
                           id="remember-me"
                           name="remember-me">
                    <label class="form-check-label" for="remember-me">
                        Запомнить меня
                    </label>
                </div>

                <!-- Кнопка входа -->
                <button type="submit" class="btn-login">
                    <i class="bi bi-box-arrow-in-right"></i>
                    Войти в систему
                </button>
            </form>
        </div>

        <!-- ПОДВАЛ -->
        <div class="login-footer">
            © Control-M • Внутренняя система протоколов
        </div>
    </div>
</div>

<script>
    // Показать/скрыть пароль
    document.getElementById('togglePassword').addEventListener('click', function() {
        const passwordInput = document.getElementById('password');
        const icon = this.querySelector('i');

        if (passwordInput.type === 'password') {
            passwordInput.type = 'text';
            icon.classList.remove('bi-eye');
            icon.classList.add('bi-eye-slash');
        } else {
            passwordInput.type = 'password';
            icon.classList.remove('bi-eye-slash');
            icon.classList.add('bi-eye');
        }
    });

    // Автофокус на поле ввода при загрузке
    document.addEventListener('DOMContentLoaded', function() {
        document.getElementById('username').focus();
    });
</script>
</body>
</html>
