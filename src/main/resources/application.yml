spring:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        jdbc:
          time_zone: Europe/Moscow
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: true
  jackson:
    time-zone: Europe/Moscow


  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html

  servlet:
    multipart:
      max-request-size: 50MB
      max-file-size: 50MB
      file-size-threshold: 0
app:
  base-url: http://localhost:8080
  qr-code:
    directory: ./qr-codes

server:
  port: 8080
  address: 0.0.0.0
  tomcat:
    max-swallow-size: -1
    max-http-form-post-size: 52428800
    max-parameter-count: 10000
    max-part-count: 500

test:
  input:
    dir: ./test-pdfs
  client-id: 1