spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/control_m
    username: control_m
    password: control_m_pass
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: Europe/Moscow
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: true
  jackson:
    time-zone: Europe/Moscow

  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html

  servlet:
    multipart:
      max-request-size: 50MB
      max-file-size: 50MB
      file-size-threshold: 0

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml

app:
  storage:
    path: /app/storage
  base-url: http://localhost:8080

logging:
  level:
    liquibase: DEBUG

server:
  port: 8080
  address: 0.0.0.0
  tomcat:
    max-swallow-size: -1
    max-http-form-post-size: 52428800
    max-parameter-count: 10000
    max-part-count: 500